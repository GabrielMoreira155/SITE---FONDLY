<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#1A1222; --plum:#241A2E; --rosa:#EF9FBC; --rosa2:#F4B6CD; --lilas:#DCB3EA;
  --ouro:#EEC25F; --tinta:#F6ECF3; --suave:#CBB4CF; --fraca:#967F9E; --linha:#4A3A54;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Nunito,sans-serif;color:var(--tinta);position:relative}

/* fundo: brilho rosado no topo + textura diagonal sutil, como o vídeo de referência */
#bg{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 38% at 50% 0%, rgba(239,159,188,.20), transparent 70%),
    radial-gradient(ellipse 60% 40% at 15% 85%, rgba(138,95,158,.22), transparent 70%),
    radial-gradient(ellipse 60% 40% at 90% 60%, rgba(92,54,112,.35), transparent 70%),
    linear-gradient(180deg,#221830 0%,#1A1222 45%,#150E1C 100%);}
#bg::after{content:"";position:absolute;inset:0;opacity:.07;
  background:repeating-linear-gradient(135deg,#fff 0 1px,transparent 1px 7px);}
#glow{position:absolute;left:50%;top:-260px;width:1100px;height:700px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(239,159,188,.18),transparent);pointer-events:none}

/* legendas */
#cap{position:absolute;left:0;right:0;top:34px;text-align:center;z-index:30}
#marca{display:flex;align-items:center;justify-content:center;gap:16px;height:84px}
#marca img{height:84px;width:auto}
#marca .tipo{font:700 17px/1 Nunito;letter-spacing:.42em;color:var(--rosa);text-transform:uppercase;padding-top:10px}
#kicker{margin-top:14px;font:800 16px/1 Nunito;letter-spacing:.34em;text-transform:uppercase;color:var(--ouro);opacity:.9}
#tituloBox{position:relative;height:150px;margin-top:14px}
.tit{position:absolute;left:0;right:0;top:0;padding:0 40px}
.tit h1{font:400 80px/1 "Bebas Neue";letter-spacing:.02em;color:var(--tinta);white-space:nowrap}
.tit h1 em{font-style:normal;color:var(--rosa)}
.tit p{margin-top:12px;font:600 28px/1.25 Nunito;color:var(--suave)}

/* dispositivos */
.dev{position:absolute;left:0;top:0;transform-origin:0 0;z-index:10}
.phone{width:418px;height:872px;border-radius:64px;padding:14px;
  background:linear-gradient(145deg,#3a2d44,#120c17 40%,#2a1f33);
  box-shadow:0 0 0 2px #56465f inset,0 0 0 1px #0b070e,0 50px 90px rgba(0,0,0,.6),0 0 120px rgba(239,159,188,.10)}
.phone .tela{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:#241A2E}
.phone .sbar{position:absolute;left:0;top:0;right:0;height:44px;background:#241A2E;z-index:5;
  display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 36px;font:700 15px Nunito;color:#F6ECF3}
.phone .sbar .ilha{position:absolute;left:50%;top:10px;width:118px;height:32px;border-radius:20px;background:#000;transform:translateX(-50%)}
.phone .sbar .ic{display:flex;gap:6px;align-items:center}
.phone iframe{position:absolute;left:0;top:44px;width:390px;height:800px;border:0;background:#241A2E}
.phone .home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.55);transform:translateX(-50%);z-index:6}

.tablet{width:860px;height:1220px;border-radius:46px;padding:20px;
  background:linear-gradient(145deg,#3a2d44,#120c17 40%,#2a1f33);
  box-shadow:0 0 0 2px #56465f inset,0 40px 80px rgba(0,0,0,.55)}
.tablet .tela{position:relative;width:820px;height:1180px;border-radius:26px;overflow:hidden;background:#241A2E}
.tablet iframe{width:820px;height:1180px;border:0;display:block}

.laptop{width:1472px;height:1000px}
.laptop .tampa{width:1472px;height:948px;border-radius:30px 30px 8px 8px;padding:16px 16px 32px;
  background:linear-gradient(180deg,#2d2336,#150f1a);box-shadow:0 0 0 2px #56465f inset,0 40px 80px rgba(0,0,0,.55)}
.laptop .tela{width:1440px;height:900px;overflow:hidden;border-radius:6px;background:#241A2E}
.laptop iframe{width:1440px;height:900px;border:0;display:block}
.laptop .base{margin:0 auto;width:1640px;margin-left:-84px;height:36px;border-radius:0 0 30px 30px;
  background:linear-gradient(180deg,#4b3d55,#241a2c);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.laptop .base::before{content:"";display:block;margin:0 auto;width:220px;height:12px;border-radius:0 0 12px 12px;background:#1a1220}

#devs{position:absolute;inset:0;z-index:10;
  -webkit-mask-image:linear-gradient(180deg,transparent 0 300px,#000 370px);mask-image:linear-gradient(180deg,transparent 0 300px,#000 370px)}
/* dedo */
#finger{position:absolute;left:0;top:0;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;
  background:rgba(255,255,255,.34);border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 24px rgba(0,0,0,.35);
  z-index:40;opacity:0;pointer-events:none}
.ripple{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;border:4px solid rgba(255,255,255,.9);z-index:39;pointer-events:none}

/* pílula de aviso (tipo "Evento criado no Google Agenda" da referência) */
#pill{position:absolute;left:50%;top:0;z-index:45;display:flex;align-items:center;gap:12px;white-space:nowrap;
  padding:16px 28px;border-radius:40px;background:#fff;color:#2C2038;font:800 24px Nunito;
  box-shadow:0 14px 40px rgba(0,0,0,.4);opacity:0;transform:translate(-50%,0)}
#pill .ico{font-size:26px}

/* interlúdio */
#inter{position:absolute;left:0;right:0;top:330px;bottom:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(16,10,22,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0}
#inter .anel{width:170px;height:170px;border-radius:50%;border:4px solid var(--ouro);display:flex;align-items:center;justify-content:center;position:relative}
#inter .anel svg{width:84px;height:84px;stroke:var(--ouro);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#inter .anel .gira{position:absolute;inset:-14px;border-radius:50%;border:3px solid transparent;border-top-color:var(--rosa)}
#inter h2{margin-top:44px;font:400 96px/1 "Bebas Neue";letter-spacing:.04em;color:var(--ouro)}
#inter p{margin-top:22px;font:800 22px Nunito;letter-spacing:.34em;color:var(--suave);text-transform:uppercase}

/* intro e encerramento */
#intro,#outro{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#intro{background:radial-gradient(ellipse 80% 50% at 50% 45%,#2c2038,#140d1a)}
#intro img{width:420px}
#intro .sub{margin-top:26px;font:700 22px Nunito;letter-spacing:.5em;color:var(--rosa);text-transform:uppercase;padding-left:.5em}
#url{margin-top:70px;display:flex;align-items:center;gap:14px;padding:22px 34px;border-radius:50px;border:2px solid var(--linha);background:rgba(46,35,56,.8);font:700 32px Nunito;color:var(--tinta);min-width:640px}
#url .cad{width:26px;height:26px;border-radius:50%;border:3px solid var(--rosa);flex:none}
#url .cursor{display:inline-block;width:3px;height:34px;background:var(--rosa);margin-left:2px;vertical-align:middle}
#intro .ver{margin-top:44px;font:400 64px/1 "Bebas Neue";letter-spacing:.06em;color:var(--tinta)}

#outro{background:radial-gradient(ellipse 80% 50% at 50% 40%,rgba(44,32,56,.97),rgba(16,10,22,.99));opacity:0}
#outro .va{width:380px;height:auto}
#outro h2{margin-top:50px;font:400 92px/1 "Bebas Neue";letter-spacing:.02em;white-space:nowrap}
#outro .serif{margin-top:8px;font:italic 400 82px/1.1 Fraunces;color:var(--rosa)}
#outro .desc{margin-top:40px;font:600 32px/1.45 Nunito;color:var(--suave)}
#outro .logo{margin-top:80px;width:230px}
#outro .site{margin-top:18px;font:800 30px Nunito;color:var(--tinta);letter-spacing:.02em}


/* WhatsApp simulado dentro do celular */
#wa{position:absolute;left:0;top:44px;width:390px;height:800px;z-index:4;background:#0B141A;transform:translateX(100%);display:flex;flex-direction:column}
#wa .cab{height:62px;background:#1F2C34;display:flex;align-items:center;gap:10px;padding:0 12px;color:#E9EDEF}
#wa .cab .av{width:38px;height:38px;border-radius:50%;background:#2C2038 url(logo.png) center/78% no-repeat;border:1px solid #4A3A54}
#wa .cab .nm{font:700 16px Nunito}
#wa .cab .st{font:600 12px Nunito;color:#8696A0;margin-top:2px}
#wa .cab .st.dig{color:#25D366}
#wa .msgs{flex:1;overflow:hidden;padding:12px 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  background:#0B141A radial-gradient(circle at 20% 30%,rgba(255,255,255,.025) 0 2px,transparent 3px) 0 0/34px 34px}
#wa .dia{align-self:center;background:#182229;color:#8696A0;font:700 11px Nunito;padding:5px 10px;border-radius:7px;margin-bottom:6px}
#wa .b{max-width:82%;padding:7px 9px 5px;border-radius:9px;font:500 14.2px/1.38 Nunito;color:#E9EDEF;white-space:pre-wrap;position:relative}
#wa .b .h{display:block;text-align:right;font:600 10.5px Nunito;color:rgba(233,237,239,.6);margin-top:2px}
#wa .b.out{align-self:flex-end;background:#005C4B}
#wa .b.in{align-self:flex-start;background:#202C33}
#wa .b.out .h::after{content:" ✓✓";color:#53BDEB}
#wa .dots{align-self:flex-start;background:#202C33;border-radius:9px;padding:10px 14px;display:flex;gap:5px}
#wa .dots i{width:7px;height:7px;border-radius:50%;background:#8696A0;display:block}
#wa .bar{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 26px}
#wa .campo{flex:1;background:#1F2C34;border-radius:22px;padding:10px 14px;font:500 14.2px/1.38 Nunito;color:#E9EDEF;white-space:pre-wrap;max-height:260px;overflow:hidden}
#wa .send{width:46px;height:46px;border-radius:50%;background:#00A884;display:flex;align-items:center;justify-content:center;flex:none}
#wa .send svg{width:22px;height:22px;fill:#fff}
</style></head>

<script>
/* ================= infraestrutura ================= */
const $ = s => document.querySelector(s);
const now = () => performance.now();
const wait = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,p) => a + (b-a)*p;
const E = {
  io: p => p<.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2,
  out: p => 1 - Math.pow(1-p,3),
  in: p => p*p*p,
  lin: p => p,
  back: p => { const c1=1.4, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); }
};
function tween(dur, fn, ease=E.io){
  return new Promise(res => {
    const t0 = now();
    fn(0);
    function f(){ const p = clamp((now()-t0)/dur,0,1); fn(ease(p)); if(p<1) requestAnimationFrame(f); else res(); }
    requestAnimationFrame(f);
  });
}
window.__events = [];
let T0 = 0;
const ev = (type, extra) => window.__events.push(Object.assign({t: now()-T0, type}, extra||{}));
const CUTS = [[4700,6100],[8700,12400],[15500,18100],[24600,25600],[47700,48700],[49700,50200],[55150,56650],
  [59000,60400],[64600,65400],[68200,73000],[77500,78300],[79400,79900],[85450,85800],[85800,88200]];
const cut = ms => ms - CUTS.reduce((s,[a,b]) => s + (ms >= b ? b-a : 0), 0);
async function at(ms){ const d = T0 + cut(ms) - now(); if(d > 0) await wait(d); }

/* ================= dispositivos ================= */
function Dev(id, fid){
  const d = {el: $(id), iframe: $(fid), st: {x:0,y:0,s:1,o:1}};
  d.apply = () => { d.el.style.transform = `translate(${d.st.x}px,${d.st.y}px) scale(${d.st.s})`; d.el.style.opacity = d.st.o; };
  d.set = o => { Object.assign(d.st, o); d.apply(); };
  d.to = (o, dur, ease=E.io) => { const a = Object.assign({}, d.st); return tween(dur, p => { for(const k in o) d.st[k] = lerp(a[k], o[k], p); d.apply(); }, ease); };
  d.win = () => d.iframe.contentWindow;
  d.doc = () => d.iframe.contentDocument;
  d.q = s => d.doc().querySelector(s);
  d.qa = s => [...d.doc().querySelectorAll(s)];
  d.k = () => d.iframe.getBoundingClientRect().width / d.iframe.offsetWidth;
  // ponto do elemento do site em coordenadas do vídeo
  d.pt = (el, fx=.5, fy=.5) => { const r = el.getBoundingClientRect(), f = d.iframe.getBoundingClientRect(), k = d.k();
    return {x: f.left + (r.left + r.width*fx)*k, y: f.top + (r.top + r.height*fy)*k}; };
  d.local = (x,y) => { const f = d.iframe.getBoundingClientRect(), k = d.k(); return {x:(x-f.left)/k, y:(y-f.top)/k}; };
  d.sy = () => d.win().scrollY;
  d.scrollTo = (y, dur=1000, ease=E.io) => { const w = d.win(); const y0 = w.scrollY;
    const max = d.doc().documentElement.scrollHeight - w.innerHeight; y = clamp(y, 0, max);
    return tween(dur, p => w.scrollTo({top: lerp(y0, y, p), behavior: "instant"}), ease); };
  d.yOf = (el, off=0) => el.getBoundingClientRect().top + d.win().scrollY - off;
  d.scrollToEl = (el, off=80, dur=1000, ease) => d.scrollTo(d.yOf(el, off), dur, ease);
  return d;
}
const P = Dev("#dPhone", "#fPhone"), TB = Dev("#dTablet", "#fTablet"), L = Dev("#dLaptop", "#fLaptop");
const PH = {x:(1080-418*1.72)/2, y:372, s:1.72};
P.set({x:PH.x, y:1960, s:PH.s, o:1});

/* ================= dedo, pílula, legendas ================= */
const finger = $("#finger");
const F = {x:540, y:1200, o:0, s:1};
const fApply = () => { finger.style.transform = `translate(${F.x}px,${F.y}px) scale(${F.s})`; finger.style.opacity = F.o; };
fApply();
function fTo(x, y, dur=450, ease=E.io){ const a = {x:F.x, y:F.y}; return tween(dur, p => { F.x = lerp(a.x,x,p); F.y = lerp(a.y,y,p); fApply(); }, ease); }
function fShow(v, dur=220){ const a = F.o; return tween(dur, p => { F.o = lerp(a, v?1:0, p); fApply(); }); }
function ripple(x, y){
  const r = document.createElement("div"); r.className = "ripple"; document.body.appendChild(r);
  tween(520, p => { r.style.transform = `translate(${x}px,${y}px) scale(${1+p*1.3})`; r.style.opacity = 1-p; }, E.out).then(() => r.remove());
}
async function press(){ ev("tap"); await tween(110, p => { F.s = 1 - .22*p; fApply(); }); ripple(F.x, F.y); await tween(160, p => { F.s = .78 + .22*p; fApply(); }); }
// toque num elemento do site: move o dedo, aperta e dispara o clique de verdade
async function tap(dev, el, opts={}){
  const p = dev.pt(el, opts.fx ?? .5, opts.fy ?? .5);
  if(F.o < .5){ F.x = p.x + 60; F.y = p.y + 90; fApply(); fShow(1); }
  await fTo(p.x, p.y, opts.move ?? 480);
  const pr = press();
  await wait(100);
  if(opts.pointer){ ptr(dev, el, "pointerdown", p.x, p.y); ptr(dev, el, "pointerup", p.x, p.y); }
  el.click();
  await pr;
}
function ptr(dev, el, type, x, y){
  const l = dev.local(x, y), w = dev.win();
  el.dispatchEvent(new w.PointerEvent(type, {bubbles:true, cancelable:true, clientX:l.x, clientY:l.y, pointerId:7, pointerType:"touch", isPrimary:true, buttons: type==="pointerup"?0:1}));
}
// arrasto contínuo sobre um elemento (caneca 3D, carrossel)
async function drag(dev, el, pts, dur){
  const p0 = pts[0];
  if(F.o < .5){ F.x = p0.x + 50; F.y = p0.y + 80; fApply(); fShow(1); }
  await fTo(p0.x, p0.y, 380);
  await tween(110, p => { F.s = 1 - .15*p; fApply(); });
  ptr(dev, el, "pointerdown", p0.x, p0.y); ev("drag");
  const seg = pts.length - 1;
  await tween(dur, p => {
    const q = p*seg, i = Math.min(seg-1, Math.floor(q)), f = q - i;
    const e = E.io(f);
    F.x = lerp(pts[i].x, pts[i+1].x, e); F.y = lerp(pts[i].y, pts[i+1].y, e); fApply();
    ptr(dev, el, "pointermove", F.x, F.y);
  }, E.lin);
  ptr(dev, el, "pointerup", F.x, F.y);
  await tween(140, p => { F.s = .85 + .15*p; fApply(); });
}
async function typeInto(dev, el, text, cps=11){
  const w = dev.win();
  for(const ch of [...text]){
    el.value += ch; el.dispatchEvent(new w.Event("input", {bubbles:true})); ev("key");
    await wait(1000/cps * (ch === " " ? 1.4 : 1));
  }
}

let pillBusy = null;
async function pill(ico, txt, y=470, hold=1700){
  const el = $("#pill"); $("#pillIco").textContent = ico; $("#pillTxt").textContent = txt; ev("pop");
  await tween(380, p => { el.style.opacity = p; el.style.transform = `translate(-50%, ${y + 30*(1-p)}px) scale(${.9+.1*p})`; }, E.back);
  await wait(hold);
  await tween(300, p => { el.style.opacity = 1-p; el.style.transform = `translate(-50%, ${y - 16*p}px)`; });
}

let titAtual = null;
function fit(h1){ let fs = 80; h1.style.fontSize = fs + "px"; while(h1.scrollWidth > 1000 && fs > 50){ fs -= 2; h1.style.fontSize = fs + "px"; } }
async function caption(t, s){
  const box = $("#tituloBox");
  const n = document.createElement("div"); n.className = "tit";

/* ================= foto de exemplo (ilustração gerada aqui mesmo) ================= */
function fotoExemplo(){
  const c = document.createElement("canvas"); c.width = 900; c.height = 700; const g = c.getContext("2d");
  const sky = g.createLinearGradient(0,0,0,700); sky.addColorStop(0,"#F7B7C9"); sky.addColorStop(.55,"#FBD3A8"); sky.addColorStop(1,"#F59E86");
  g.fillStyle = sky; g.fillRect(0,0,900,700);
  const sun = g.createRadialGradient(450,410,10,450,410,190); sun.addColorStop(0,"#FFF6D8"); sun.addColorStop(.45,"#FFE3A1"); sun.addColorStop(1,"rgba(255,227,161,0)");
  g.fillStyle = sun; g.beginPath(); g.arc(450,410,190,0,Math.PI*2); g.fill();
  g.fillStyle = "#C9667E"; g.beginPath(); g.moveTo(0,520); g.bezierCurveTo(220,430,380,560,560,500); g.bezierCurveTo(700,455,820,500,900,480); g.lineTo(900,700); g.lineTo(0,700); g.fill();
  g.fillStyle = "#8E3F63"; g.beginPath(); g.moveTo(0,600); g.bezierCurveTo(240,540,480,650,900,570); g.lineTo(900,700); g.lineTo(0,700); g.fill();
  // mãe e filha de mãos dadas (silhueta)
  g.fillStyle = "#4A1E3A";
  const pessoa = (x, y, h) => { g.beginPath(); g.arc(x, y - h*.86, h*.11, 0, Math.PI*2); g.fill();
    g.beginPath(); g.moveTo(x - h*.16, y - h*.02); g.quadraticCurveTo(x - h*.13, y - h*.55, x, y - h*.72); g.quadraticCurveTo(x + h*.13, y - h*.55, x + h*.16, y - h*.02); g.fill(); };
  pessoa(395, 560, 190); pessoa(515, 572, 120);
  g.lineWidth = 9; g.strokeStyle = "#4A1E3A"; g.lineCap = "round"; g.beginPath(); g.moveTo(428, 470); g.quadraticCurveTo(470, 500, 500, 490); g.stroke();
  g.fillStyle = "rgba(255,255,255,.85)";
  const cor = (x,y,s) => { g.beginPath(); g.moveTo(x, y + s*.3); g.bezierCurveTo(x - s, y - s*.4, x - s*.4, y - s, x, y - s*.45); g.bezierCurveTo(x + s*.4, y - s, x + s, y - s*.4, x, y + s*.3); g.fill(); };
  cor(250,190,34); cor(650,150,26); cor(720,250,18); cor(170,300,16);
  return new Promise(r => c.toBlob(r, "image/jpeg", .92));
}
